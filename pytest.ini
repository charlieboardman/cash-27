[pytest]
testpaths = tests
# Tests import helpers from each other (from tests.test_qr_capture import ...).
pythonpath = .
# One worker per CPU core; the browser tests make up most of the time and
# spread well. Use -n 0 to run serially (pdb, print debugging) or -n 4 to cap
# workers on a machine short of memory.
addopts = -n auto
