<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Cash{% endblock %}</title>
{% include '_app_head.html' %}
<link rel="stylesheet" href="/static/css/app.css?v={{ asset_version }}">
<link rel="stylesheet" href="/static/css/code-picker.css?v={{ asset_version }}">
<script src="/static/js/signee-i18n.js?v={{ asset_version }}"></script>
<script src="/static/js/common.js?v={{ asset_version }}"></script>
<script defer src="/static/vendor/fzf/fzf-0.5.2.umd.js"></script>
<script defer src="/static/js/code-picker.js?v={{ asset_version }}"></script>
</head>
<body class="report-shell">
<main class="{% block main_class %}{% endblock %}">
<div class="signee-language-toggle" role="group" aria-label="Language / Idioma">
  <button type="button" lang="en" data-signee-language="en" aria-pressed="true">English</button>
  <button type="button" lang="es" data-signee-language="es" aria-pressed="false">Español</button>
</div>
{% block body %}{% endblock %}
</main>
</body>
</html>
