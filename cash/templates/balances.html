{% extends "base.html" %}
{% block title %}Balances{% endblock %}
{% block main_class %}balances-main{% endblock %}
{% block body %}
<header class="page-header">
  <h1 class="page-title">Balances</h1>
</header>

<output id="balances-message" class="notice" role="status" hidden></output>

<section class="balances-grid" id="balances-grid">
  <article class="balance-hero" id="safe-card">
    <header><h2>Safe</h2>
      <a class="btn ghost" href="/ledger">Ledger</a></header>
    <div class="balance-hero-figures" id="safe-figures"></div>
    <p class="balance-totals muted" id="safe-totals"></p>
    <div class="count-tool">
      <h3>Count the safe</h3>
      <form id="count" class="form-grid two" autocomplete="off">
        <label><span>Counted USD</span><input name="usd" inputmode="decimal"></label>
        <label><span>Counted MXN</span><input name="mxn" inputmode="decimal"></label>
        <button class="btn ghost" type="submit">Compare</button>
      </form>
      <output id="delta" role="status"></output>
      <form id="correction" hidden>
        <label><span>Reason</span><input name="reason" maxlength="200"></label>
        <label id="correction-rate" hidden><span>MXN per USD rate for the extra MXN</span>
          <input name="rate" inputmode="decimal"></label>
        <button class="btn primary">Save count</button>
      </form>
    </div>
  </article>
</section>

<section class="signouts-panel" id="signouts-panel">
  <header class="pane-heading">
    <h2>Signouts</h2>
    <span id="signouts-summary" class="count-pill"></span>
  </header>
  <ol id="signout-list" class="signout-list"></ol>
</section>

<script src="/static/js/balances.js?v={{ asset_version }}"></script>
{% endblock %}
