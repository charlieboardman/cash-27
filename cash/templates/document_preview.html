{% extends "base.html" %}
{% block title %}Preview document{% endblock %}
{% block main_class %}document-preview-page{% endblock %}
{% block body %}
<header class="page-header">
  <div>
    <a class="btn ghost" href="{{ back }}">← {{ back_label }}</a>
    <h1 class="page-title">{{ name }}</h1>
  </div>
</header>
<div id="document-viewer"></div>
<script>
  (() => {
    const root = document.getElementById("document-viewer");
    root.innerHTML = cashPageViewer.markup();
    cashPageViewer.mount(root, {
      document_id: {{ document_id | tojson }},
      display_name: {{ name | tojson }},
      page_count: {{ page_count }},
      stream_url: {{ stream_url | tojson }},
    });
  })();
</script>
{% endblock %}
