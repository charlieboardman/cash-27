{% extends "base.html" %}
{% block title %}Reports{% endblock %}
{% block main_class %}workspace-main{% endblock %}
{% block body %}
<header class="page-header reports-header">
  <h1 class="page-title">Reports</h1>
</header>

<section class="report-builder">
  <div class="report-period">
    <label for="report-type"><span>Export type</span><select id="report-type">
      <option value="expenses">Expense report</option>
      <option value="cash_ledger">Cash ledger</option>
    </select></label>
    <p id="report-type-description">Expense lines with account and class codes.</p>
    <label for="report-format"><span>Format</span><select id="report-format">
      <option value="xlsx">XLSX</option><option value="csv">CSV</option>
    </select></label>
    <label for="report-fy"><span>Fiscal year</span>
      <select id="report-fy" data-first-fy="{{ first_fy }}"
              data-fy-start-month="{{ fy_start_month }}"></select></label>
    <p id="period-description"></p>
  </div>
  <div class="report-choice">
    <div class="export-actions" role="group" aria-label="Report actions">
      <a id="view-bookkeeper" class="btn primary" href="/reports/bookkeeper">View bookkeeper report</a>
      <a id="download-documents" class="btn ghost" href="/api/export/bookkeeper.zip">Download with documents</a>
      <button id="download-report" class="btn">Download</button>
    </div>
    <p>Includes transactions still awaiting review.</p>
    <output id="report-status" class="notice" role="status" hidden></output>
  </div>
</section>
<script src="/static/js/reports.js?v={{ asset_version }}"></script>
{% endblock %}
