{% extends "base.html" %}
{% block title %}Record a cash donation{% endblock %}
{% block main_class %}workspace-main{% endblock %}
{% block body %}
<header class="page-header"><div>
  <p class="eyebrow">Cash received</p>
  <h1 class="page-title">Record a cash donation</h1>
  <p class="muted">Add donated cash received into the safe.</p>
</div><a class="btn ghost" href="/voucher">Back to Prepare</a></header>

<form id="cash-entry" class="workflow-card" data-kind="donation"
      data-mxn-rate-required="{{ 'true' if mxn_rate_required else 'false' }}"
      autocomplete="off">
  <section class="workflow-section">
    <div class="section-heading"><div><p class="eyebrow">Donation</p>
      <h2>Date and cash received</h2></div></div>
    <div class="form-grid two">
      <label><span>Date received</span><input type="date" name="date" required></label>
      <label><span>USD received</span><input name="usd" inputmode="decimal"></label>
      <label><span>MXN received</span><input name="mxn" inputmode="decimal"></label>
      <label id="cash-entry-rate" hidden><span>Approved MXN per USD rate</span>
        <input name="rate" inputmode="decimal">
        <small>Required because the safe does not currently have MXN with an established value.</small></label>
      <label class="full"><span>Notes</span><textarea name="notes" rows="2"></textarea></label>
    </div>
  </section>
  <footer class="workflow-actions">
    <output id="cash-entry-status" role="status"></output>
    <button type="submit" class="btn primary">Save donation</button>
  </footer>
</form>
<script src="/static/js/cash-entry.js"></script>
{% endblock %}
