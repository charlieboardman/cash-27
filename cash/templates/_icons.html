{# Selected Lucide icons, inlined so labeled controls also work in offline reports.
   License: cash/static/icons/licenses/Lucide.txt. #}
{% macro icon(name, class='') -%}
<svg class="icon{% if class %} {{ class }}{% endif %}" viewBox="0 0 24 24" fill="none"
     stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
     stroke-linejoin="round" aria-hidden="true" focusable="false">
  {% if name == 'overview' %}<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
  {% elif name == 'more' %}<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>
  {% elif name == 'plus' %}<path d="M5 12h14M12 5v14"/>
  {% elif name == 'clipboard-check' %}<rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2m1 11 2 2 4-4"/>
  {% elif name == 'camera' %}<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"/><circle cx="12" cy="13" r="3"/>
  {% elif name == 'wallet' %}<path d="M19 7V5a2 2 0 0 0-2-2H5a3 3 0 0 0 0 6h15a1 1 0 0 1 1 1v9a2 2 0 0 1-2 2H5a3 3 0 0 1-3-3V6"/><path d="M16 13h2"/>
  {% elif name == 'book-open' %}<path d="M2 4h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zm20 0h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
  {% elif name == 'chart' %}<path d="M3 3v18h18M7 16v-5m5 5V8m5 8V5"/>
  {% elif name == 'settings' %}<path d="M4 21v-7m0-4V3m8 18v-9m0-4V3m8 18v-5m0-4V3M1 14h6m2-6h6m2 8h6"/>
  {% elif name == 'log-out' %}<path d="M10 17l5-5-5-5m5 5H3m10-9h5a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-5"/>
  {% elif name == 'download' %}<path d="M12 3v12m-5-5 5 5 5-5M5 21h14"/>
  {% elif name == 'upload' %}<path d="M12 17V5m-5 5 5-5 5 5M5 21h14"/>
  {% elif name == 'file-text' %}<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8m-8 4h6"/>
  {% elif name == 'filter' %}<path d="M4 4h16l-6 7v6l-4 3v-9z"/>
  {% elif name == 'x' %}<path d="M18 6 6 18M6 6l12 12"/>
  {% elif name == 'printer' %}<path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/>
  {% elif name == 'paperclip' %}<path d="m21.4 11.6-8.9 8.9a6 6 0 0 1-8.5-8.5l9.6-9.6a4 4 0 0 1 5.7 5.7l-9.6 9.6a2 2 0 0 1-2.8-2.8l8.9-8.9"/>
  {% elif name == 'save' %}<path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/>
  {% elif name == 'donation' %}<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8z"/><path d="M12 8v8m-3-4h6"/>
  {% elif name == 'exchange' %}<path d="m7 7-4 4 4 4m-4-4h14m0 6 4-4-4-4m4 4H7"/>
  {% elif name == 'landmark' %}<path d="m3 10 9-6 9 6M5 10v8m4-8v8m6-8v8m4-8v8M3 22h18M2 18h20"/>
  {% elif name == 'receipt' %}<path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1z"/><path d="M8 8h8m-8 4h8m-8 4h5"/>
  {% elif name == 'user' %}<circle cx="12" cy="8" r="4"/><path d="M4 22a8 8 0 0 1 16 0"/>
  {% elif name == 'compare' %}<rect x="4" y="2" width="16" height="20" rx="2"/><path d="M8 6h8M8 11h.01m4 0h.01m4 0h.01M8 15h.01m4 0h.01m4 0h.01M8 19h.01m4 0h.01m4 0h.01"/>
  {% elif name == 'external-link' %}<path d="M15 3h6v6m0-6-9 9"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
  {% elif name == 'search' %}<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>
  {% elif name == 'chevrons' %}<path d="m8 9 4-4 4 4m0 6-4 4-4-4"/>
  {% elif name == 'eye' %}<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>
  {% elif name == 'check' %}<path d="m5 12 4 4L19 6"/>
  {% elif name == 'package' %}<path d="m12 3 9 5-9 5-9-5zM3 8v8l9 5 9-5V8M12 13v8"/>
  {% elif name == 'arrow-left' %}<path d="m15 18-6-6 6-6M9 12h12"/>
  {% elif name == 'trash' %}<path d="M3 6h18M8 6V4h8v2m3 0-1 16H6L5 6m5 4v8m4-8v8"/>
  {% endif %}
</svg>
{%- endmacro %}
