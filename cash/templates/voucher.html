{% extends "base.html" %}
{% block title %}New transaction{% endblock %}
{% block main_class %}workspace-main{% endblock %}
{% block body %}
<header class="page-header">
  <h1 class="page-title">New transaction</h1>
  <a class="btn ghost" href="/donation">Record a donation</a>
</header>

<form id="prep" class="workflow-card" autocomplete="off">
  <fieldset class="type-picker">
    <legend class="sr-only">Transaction type</legend>
    <label><input type="radio" name="type" value="direct_expense" checked>
      <span><strong>Direct expense</strong><small>Pay a vendor now</small></span>
    </label>
    <label><input type="radio" name="type" value="signout">
      <span><strong>Signout</strong><small>Give cash to someone who brings back receipts</small></span>
    </label>
    <label><input type="radio" name="type" value="exchange">
      <span><strong>Currency exchange</strong><small>Exchange USD for MXN</small></span>
    </label>
    <label><input type="radio" name="type" value="withdrawal">
      <span><strong>Bank withdrawal</strong><small>Move USD from the bank to the safe</small></span>
    </label>
  </fieldset>

  <section class="workflow-section" id="common-fields">
    <div class="form-grid two">
      <label><span>Date</span><input type="date" name="date" required></label>
    </div>
  </section>

  <section class="workflow-section" id="voucher-fields">
    <div class="form-grid two">
      <label><span id="recipient-label">Vendor</span>
        <input name="recipient" maxlength="60" required></label>
      <label><span>Purpose</span><input name="purpose" maxlength="100" required></label>
      <label><span>Approver name</span><input name="approver_name" maxlength="60" value="{{ default_approver_name }}">
        <small>Default set in <a href="/settings" target="_blank" rel="noopener">Settings</a>.</small></label>
    </div>
  </section>

  <section class="workflow-section" id="simple-amount-fields">
    <h2>Amount authorized</h2>
    <div class="form-grid two">
      <label><span>USD</span><input name="usd" inputmode="decimal" placeholder="0"></label>
      <label><span>MXN</span><input name="mxn" inputmode="decimal" placeholder="0"></label>
    </div>
  </section>

  <section class="workflow-section" id="exchange-fields" hidden>
    <div class="form-grid two">
      <label><span>Cash account</span><select name="source_account">
        {% for account in cash_accounts %}
        <option value="{{ account.account_id }}"{% if account.account_id == "SAFE" %} selected{% endif %}>{{ account.name }} ({{ account.account_id }})</option>
        {% endfor %}
      </select></label>
      <span aria-hidden="true"></span>
      <label><span>USD exchanged</span><input name="exchange_usd"
        inputmode="decimal"></label>
      <label><span>MXN received</span><input name="exchange_mxn"
        inputmode="decimal"></label>
    </div>
  </section>

  <section class="workflow-section" id="withdrawal-fields" hidden>
    <div class="form-grid two">
      <label><span>USD received</span><input name="withdrawal_usd"
        inputmode="decimal"></label>
    </div>
  </section>

  <section class="workflow-section" id="notes-fields">
    <label><span>Notes</span><textarea name="notes" rows="2" maxlength="200"></textarea></label>
  </section>

  <footer class="workflow-actions">
    <output id="status" role="status"></output>
    <div class="workflow-action-buttons">
      <button type="submit" class="btn primary" id="prep-save" value="save">Save</button>
      <button type="submit" class="btn" id="prep-submit" value="print">Save and print voucher</button>
    </div>
  </footer>
</form>


<script src="/static/js/prep.js?v={{ asset_version }}"></script>
{% endblock %}
