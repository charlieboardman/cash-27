<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Cash{% endblock %}</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/static/css/app.css?v={{ asset_version }}">
<script src="/static/js/common.js?v={{ asset_version }}"></script>
</head>
<body>
<nav class="topnav" aria-label="Main">
  <span class="brand">Cash</span>
  <div class="nav-scroll">
    <div class="nav-workflow" aria-label="Cash workflow">
      <a href="/transactions/new">New transaction</a>
      <a href="/review">Review transactions</a>
      <a href="/capture">Capture documents</a>
      <a href="/balances">Balances</a>
      <a href="/ledger">View ledger</a>
      <a href="/reports">Generate reports</a>
    </div>
    <span class="nav-divider" aria-hidden="true"></span>
    <div class="nav-utility">
      <a href="/settings">Settings</a>
      <a href="/api/logout" id="logout">Log out</a>
    </div>
  </div>
</nav>
{% if backup_warning %}
<a class="backup-warning-banner" href="/settings#backup-health">
  <strong>Backup warning</strong><span>{{ backup_warning }}</span>
  <span aria-hidden="true">Review in Settings →</span>
</a>
{% endif %}
<main class="{% block main_class %}{% endblock %}">
{% block body %}{% endblock %}
</main>
</body>
</html>
