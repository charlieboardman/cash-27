<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="Sign in to your expense report">Sign in to your expense report</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/static/css/app.css?v={{ asset_version }}">
</head>
<body class="login-body">
<main class="login-card">
<div class="signee-language-toggle" role="group" aria-label="Language / Idioma">
  <button type="button" lang="en" data-signee-language="en" aria-pressed="true">English</button>
  <button type="button" lang="es" data-signee-language="es" aria-pressed="false">Español</button>
</div>
  <h1 data-i18n="Sign in to your expense report">Sign in to your expense report</h1>
  <form id="user-login-form">
    <label><span data-i18n="Shared password">Shared password</span>
      <input name="password" type="password" autocomplete="current-password"
             required autofocus></label>
    <label class="remember-login">
      <input type="checkbox" name="remember">
      <span data-i18n="Keep me signed in on this device">Keep me signed in on this device</span>
    </label>
    <p class="login-hint" data-i18n="For up to 90 days between visits, or until you log out.">For up to 90 days between visits, or until you log out.</p>
    <output id="login-status" role="alert"></output>
    <button class="btn primary" type="submit" data-i18n="Continue">Continue</button>
  </form>
</main>
<script src="/static/js/signee-i18n.js?v={{ asset_version }}"></script>
<script>
const form = document.getElementById("user-login-form");
form.addEventListener("submit", async event => {
  event.preventDefault();
  const status = document.getElementById("login-status");
  status.textContent = signeeI18n.t("Checking…");
  const next = new URLSearchParams(location.search).get("next") || "/";
  const response = await fetch("/api/user-login", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({password: form.password.value, next, remember: form.elements.remember.checked})
  });
  const payload = await response.json();
  if (!response.ok || !payload.ok) {
    status.textContent = signeeI18n.error(payload.error || {message: "Unable to sign in"});
    return;
  }
  location.assign(payload.data.next_url);
});
</script>
</body>
</html>
