<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ voucher_id }}</title>
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="signee-body">
<main>
  <h1 class="page-title">{{ voucher_id }}</h1>
  <p id="purpose" class="muted"></p>

  <section class="card">
    <h2 class="page-title">Balance</h2>
    <p>Held: USD <b id="bal-usd"></b> · MXN <b id="bal-mxn"></b></p>
    <p id="pending">After pending receipts: USD <b id="proj-usd"></b> ·
       MXN <b id="proj-mxn"></b>
       <span id="neg-warn" class="warn" hidden>
         — balance would go negative</span></p>
  </section>

  <section class="card">
    <h2 class="page-title">Receipts</h2>
    <ol id="claims" class="claims"></ol>
    <h3>New receipt</h3>
    <form id="new-claim">
      <label>Date <input type="date" name="date" required></label>
      <label>Vendor <input name="vendor" required></label>
      <label>Description <input name="description" required></label>
      <label>Amount on receipt <input name="face_value"
        inputmode="decimal" required></label>
      <label>Denomination
        <select name="face_currency"><option>MXN</option>
        <option>USD</option></select></label>
      <label>USD paid <input name="usd_paid" inputmode="decimal"
        value="0"></label>
      <label>MXN paid <input name="mxn_paid" inputmode="decimal"
        value="0"></label>
      <label>MXN change <input name="mxn_change" inputmode="decimal"
        value="0"></label>
      <label>USD change <input name="usd_change" inputmode="decimal"
        value="0"></label>
      <label>Notes <input name="notes"></label>
      <label>Document <input type="file" id="claim-file"
        accept="application/pdf,image/jpeg,image/png" required></label>
      <button class="btn primary">Add draft</button>
    </form>
    <div class="toolbar">
      <button id="submit-selected" class="btn">Submit selected</button>
    </div>
  </section>

  <section class="card">
    <h2 class="page-title">Packages</h2>
    <ol id="packages"></ol>
  </section>

  <script src="/static/js/signee.js"></script>
</main>
</body>
</html>
