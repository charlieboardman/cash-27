{% extends "base.html" %}
{% block title %}Ledger{% endblock %}
{% block body %}
<h1>Ledger</h1>
<section id="balances" aria-label="Balances"></section>

<section aria-label="Safe count">
  <h2>Physical safe count</h2>
  <form id="count" autocomplete="off">
    <label>Counted USD <input name="usd" inputmode="decimal" required></label>
    <label>Counted MXN <input name="mxn" inputmode="decimal" required></label>
    <button>Compare</button>
  </form>
  <output id="delta" role="status"></output>
  <form id="correction" hidden>
    <h3>Create correction</h3>
    <label>Reason <input name="reason" required></label>
    <button>Post adjustment</button>
  </form>
</section>

<section aria-label="Filters">
  <form id="filters">
    <input name="fy" placeholder="FY year (e.g. 2026)">
    <input name="voucher" placeholder="Voucher">
    <input name="account" placeholder="Account">
    <button>Filter</button>
  </form>
</section>

<table id="txns">
  <thead><tr>
    <th>Date</th><th>Type</th><th>From</th><th>To</th>
    <th class="num">USD</th><th class="num">MXN</th>
    <th class="num">calc&nbsp;USD</th><th>Voucher</th><th>State</th>
  </tr></thead>
  <tbody></tbody>
</table>
<script src="/static/js/ledger.js"></script>
{% endblock %}
