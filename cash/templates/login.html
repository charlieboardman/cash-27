<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in</title>
{% include '_app_head.html' %}
<link rel="stylesheet" href="/static/css/app.css?v={{ asset_version }}">
</head>
<body class="login-body">
<main class="login-main">
<section class="login-card">
<h1>Cash</h1>
<form id="login">
  <input type="text" name="username" value="admin"
         autocomplete="username" hidden>
  <div class="login-field"><label for="login-password">Administrator password</label>
    <span class="password-field"><input id="login-password" type="password" name="password"
           autocomplete="current-password" autofocus required><button type="button"
           class="text-button" data-toggle-password aria-pressed="false">Show</button></span></div>
  <label class="remember-login">
    <input type="checkbox" name="remember" checked>
    <span>Keep me signed in on this device</span>
  </label>
  <p class="login-hint">For up to 90 days between visits, or until you log out.</p>
  <button type="submit" class="btn primary">Log in</button>
  <output id="err" role="alert"></output>
</form>
<p class="login-install muted">To install, choose Install app or Add to Home
  Screen in your browser’s menu.</p>
</section>
<script src="/static/js/password-toggle.js?v={{ asset_version }}"></script>
<script>
document.getElementById("login").addEventListener("submit", async e => {
  e.preventDefault();
  const r = await fetch("/api/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      password: new FormData(e.target).get("password"),
      remember: e.target.elements.remember.checked }),
  });
  const payload = await r.json();
  if (r.ok) location.href = payload.data.next_url;
  else document.getElementById("err").textContent = payload.error.message;
});
</script>
</main>
</body>
</html>
