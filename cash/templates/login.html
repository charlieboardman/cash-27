<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in</title>
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<main style="max-width: 20em; margin: 4em auto;">
<h1>Cash management</h1>
<form id="login">
  <label>Password <input type="password" name="password"
    autocomplete="current-password" autofocus required></label>
  <button type="submit">Log in</button>
  <output id="err" role="alert"></output>
</form>
<script>
document.getElementById("login").addEventListener("submit", async e => {
  e.preventDefault();
  const r = await fetch("/api/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      password: new FormData(e.target).get("password") }),
  });
  if (r.ok) location.href = "/voucher";
  else document.getElementById("err").textContent =
    (await r.json()).error.message;
});
</script>
</main>
</body>
</html>
